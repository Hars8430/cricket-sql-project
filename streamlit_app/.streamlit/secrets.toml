# MySQL Database Connection
# For local development with Docker:
#   DB_HOST = "localhost"
#   DB_PORT = "3306"
#   DB_USER = "root"
#   DB_PASSWORD = "cricket123"
#   DB_NAME = "cricket_db"
#
# For Streamlit Cloud (requires a publicly accessible MySQL database):
#   Use a managed MySQL service like:
#     - PlanetScale (free tier available)
#     - Railway
#     - AWS RDS
#     - Google Cloud SQL
#     - or any other cloud MySQL provider
#
# Leave blank to use demo/sample data mode:
db_host = ""
db_port = "3306"
db_user = "root"
db_password = "cricket123"
db_name = "cricket_db"
